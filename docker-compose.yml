services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: liquor-backend
    restart: unless-stopped
    environment:
      USE_MOCK_DB: "false"
      PORT: 8080
      JWT_SECRET: dev-secret
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root123456
      DB_NAME: liquor_inventory
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: admin-web/Dockerfile
    container_name: liquor-admin-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  store-terminal:
    build:
      context: .
      dockerfile: store-terminal/Dockerfile
    container_name: liquor-store-terminal
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - backend

  mysql:
    image: mysql:8.4
    container_name: liquor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: liquor_inventory
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/phase1_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./docs/phase1_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: liquor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
