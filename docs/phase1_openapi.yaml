          nullable: true
        customerName:
          type: string
        customerType:
          type: string
          enum: [RETAIL, WHOLESALE]
        businessStatus:
          type: string
          enum: [DRAFT, CREATED, COMPLETED, VOIDED, RETURNED]
        collectionStatus:
          type: string
          enum: [UNPAID, PENDING, SHARED, PARTIAL, PAID, OVERDUE, CLOSED]
        receivableAmount:
          type: number
        receivedAmount:
          type: number
        unreceivedAmount:
          type: number
        items:
          type: array
          items:
            $ref: '#/components/schemas/SaleBillItem'

    SaleBillItem:
      type: object
