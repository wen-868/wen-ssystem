<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI助手 — 打磨预览</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  body { background:#F3F4F6; }
  .phone { width:375px; height:812px; margin:24px auto; background:#fff; border-radius:32px; overflow:hidden;
           box-shadow:0 8px 32px rgba(0,0,0,0.15); position:relative; display:flex; flex-direction:column; }
  .head { height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; border-bottom:1px solid #F3F4F6; }
  .head-title { font-size:16px; font-weight:600; }
  .head-actions { display:flex; gap:12px; font-size:16px; color:#6B7280; }
  .content { flex:1; overflow-y:auto; padding:16px; }
  .welcome { font-size:18px; font-weight:600; color:#000; margin-bottom:4px; }
  .welcome-sub { font-size:13px; color:#6B7280; margin-bottom:16px; }
  .quick-label { font-size:12px; color:#9CA3AF; margin-bottom:8px; }
  .quick { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:18px; }
  .q-item { background:#F3F4F6; border-radius:8px; padding:10px 4px; text-align:center; font-size:12px; color:#1F2937; }
  .msg-user { background:#EEF2FF; border-radius:12px 12px 2px 12px; padding:10px 14px; margin-left:60px; font-size:14px; color:#1F2937; margin-bottom:12px; }
  .msg-ai { background:#F3F4F6; border-radius:12px 12px 12px 2px; padding:10px 14px; margin-right:40px; font-size:13px; color:#1F2937; margin-bottom:12px; }
  .preview { background:#fff; border-radius:8px; border:1px solid #E5E7EB; padding:12px; margin-top:8px; }
  .pv-title { font-size:12px; font-weight:600; margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .pv-row { display:flex; justify-content:space-between; font-size:12px; color:#6B7280; margin:4px 0; }
  .pv-row .v { color:#1F2937; }
  .pv-amount { font-size:16px; font-weight:700; color:#000; text-align:right; margin-top:6px; }
  .pv-warn { background:#FFF7ED; color:#F59E0B; font-size:11px; border-radius:6px; padding:6px 8px; margin-top:8px; }
  .pv-ops { display:flex; gap:8px; margin-top:10px; }
  .pv-btn { flex:1; text-align:center; font-size:13px; border-radius:8px; padding:9px 0; }
  .pv-btn.confirm { background:linear-gradient(135deg,#6366F1,#2563EB); color:#fff; font-weight:600; }
  .pv-btn.edit { border:1px solid #E5E7EB; color:#1F2937; }
  .pv-btn { transition:transform .12s ease, opacity .12s ease; }
  .pv-btn:active { transform:scale(.97); opacity:.9; }
  .inputbar { display:flex; align-items:center; gap:10px; padding:10px 16px; border-top:1px solid #F3F4F6; }
  .inputbar input { flex:1; height:38px; border:none; background:#F3F4F6; border-radius:19px; padding:0 16px; font-size:14px; outline:none; }
  .inputbar input:focus { box-shadow:0 0 0 2px rgba(99,102,241,.25); }
  .mic { width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,#6366F1,#2563EB); color:#fff;
         display:flex; align-items:center; justify-content:center; font-size:16px; box-shadow:0 2px 8px rgba(99,102,241,.35); }
  .ai-avatar { width:28px; height:28px; border-radius:50%; background:linear-gradient(135deg,#6366F1,#2563EB); color:#fff;
               display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; flex-shrink:0; }
  .msg-ai { display:flex; gap:8px; align-items:flex-start; margin-right:40px; }
  .msg-ai .bubble { background:#F3F4F6; border-radius:12px 12px 12px 2px; padding:10px 14px; font-size:13px; color:#1F2937; }
</style>
</head>
<body>
<div class="phone">
  <div class="head">
    <div class="head-title">AI助手</div>
    <div class="head-actions"><span>📷</span><span>✕</span></div>
  </div>
  <div class="content">
    <div class="welcome">欢迎回来，张老板</div>
    <div class="welcome-sub">今天有什么可以帮您？</div>
    <div class="quick-label">💡 快捷指令</div>
    <div class="quick">
      <div class="q-item">🧾 开销售单</div><div class="q-item">📦 查库存</div><div class="q-item">💰 查应收</div>
      <div class="q-item">📊 今日简报</div><div class="q-item">📥 补货建议</div><div class="q-item">🏷️ 调价格</div>
    </div>
    <div class="msg-user">给红星商行送10箱五粮液</div>
    <div class="msg-ai">
      <div class="ai-avatar">AI</div>
      <div class="bubble">
      好的，已为您生成销售单预览：
      <div class="preview">
        <div class="pv-title">📄 销售单预览</div>
        <div class="pv-row"><span>客户</span><span class="v">红星商行</span></div>
        <div class="pv-row"><span>商品</span><span class="v">五粮液52度 500ml</span></div>
        <div class="pv-row"><span>数量</span><span class="v">10箱（60瓶）</span></div>
        <div class="pv-row"><span>单价</span><span class="v">¥850/瓶（批发价）</span></div>
        <div class="pv-row"><span>配送</span><span class="v">到店自取</span></div>
        <div class="pv-amount">¥51,000</div>
        <div class="pv-warn">⚠️ 该客户有 ¥18,500 逾期未收</div>
        <div class="pv-ops"><div class="pv-btn confirm">✅ 确认开单</div><div class="pv-btn edit">✏️ 修改</div></div>
      </div>
      </div>
    </div>
  </div>
  <div class="inputbar">
    <input placeholder="说一句话，即可开单、查库存、对账…">
    <div class="mic">🎤</div>
  </div>
</div>
</body>
</html>
