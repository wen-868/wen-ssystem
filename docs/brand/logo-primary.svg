<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <!-- 智享全链 · 主标识（几何极简 / 负空间）
       圆形徽章 = 全链路闭环；白色负空间 = 高脚酒杯；杯口气泡 = 智能(AI)/活力 -->
  <circle cx="100" cy="100" r="97" fill="#3F6FEF"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>
  <g fill="#ffffff">
    <!-- 酒杯杯身：杯口微弧、收口杯底 -->
    <path d="M62 72 Q100 94 138 72 L120 136 Q100 150 80 136 Z"/>
    <!-- 杯脚杆 -->
    <rect x="96" y="140" width="8" height="30" rx="4"/>
    <!-- 杯脚底座 -->
    <rect x="79" y="168" width="42" height="9" rx="4.5"/>
    <!-- 升腾气泡（智能/活力） -->
    <circle cx="72" cy="46" r="9"/>
    <circle cx="90" cy="31" r="5"/>
  </g>
</svg>
