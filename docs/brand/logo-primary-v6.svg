<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <!-- 智享全链 · 主标识 v6（"智"字几何变形 · 精修：口改描边、留白更足） -->
  <circle cx="100" cy="100" r="96" fill="#EAF2FF"/>
  <circle cx="100" cy="100" r="96" fill="none" stroke="#3F6FEF" stroke-width="6"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="#BFD7FF" stroke-width="2"/>
  <!-- 矢：左上斜撇（智能箭头） -->
  <line x1="60" y1="58" x2="94" y2="90" stroke="#1E3A8A" stroke-width="11" stroke-linecap="round"/>
  <!-- 矢：上横 -->
  <rect x="60" y="44" width="28" height="10" rx="5" fill="#1E3A8A"/>
  <!-- 口：描边圆角方（轻量化，与整体呼应） -->
  <rect x="104" y="42" width="38" height="38" rx="9" fill="none" stroke="#1E3A8A" stroke-width="9"/>
  <!-- 日：底部横长圆角矩形 + 中线负空间 -->
  <rect x="62" y="108" width="80" height="38" rx="9" fill="#3F6FEF"/>
  <rect x="68" y="124" width="68" height="4" rx="2" fill="#EAF2FF"/>
</svg>
