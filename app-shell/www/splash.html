<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover" />
  <title>智享商家端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #1677FF 0%, #409EFF 50%, #69B1FF 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }

    /* 背景装饰圆 */
    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      pointer-events: none;
    }
    .bg-circle:nth-child(1) {
      width: 320px; height: 320px;
      top: -120px; right: -100px;
      animation: float 8s ease-in-out infinite;
    }
    .bg-circle:nth-child(2) {
      width: 200px; height: 200px;
      bottom: -60px; left: -80px;
      animation: float 6s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    /* 主容器 */
    .splash-container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    /* Logo 图标 */
    .logo-icon {
      width: 88px;
      height: 88px;
      background: rgba(255,255,255,0.18);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.12);
      animation: logoPulse 2s ease-in-out infinite;
    }

    @keyframes logoPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .logo-icon svg {
      width: 48px;
      height: 48px;
    }

    /* 应用名称 */
    .app-name {
      font-size: 26px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: 2px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    /* 副标题 */
    .app-subtitle {
      font-size: 13px;
      color: rgba(255,255,255,0.75);
      letter-spacing: 1px;
      margin-top: -4px;
    }

    /* 加载指示器 */
    .loader {
      margin-top: 32px;
      display: flex;
      gap: 6px;
    }

    .loader-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      animation: dotBounce 1.4s ease-in-out infinite;
    }

    .loader-dot:nth-child(2) { animation-delay: 0.16s; }
    .loader-dot:nth-child(3) { animation-delay: 0.32s; }

    @keyframes dotBounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* 版本号 */
    .version {
      position: absolute;
      bottom: 40px;
      font-size: 12px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 1px;
    }

    /* 渐出动画 */
    .splash-out {
      animation: fadeOut 0.4s ease-out forwards;
      pointer-events: none;
    }

    @keyframes fadeOut {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>

  <div class="splash-container" id="splash">
    <!-- Logo - 简约酒瓶/商店图标 -->
    <div class="logo-icon">
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- 外框 -->
        <rect x="4" y="4" width="40" height="40" rx="12" stroke="white" stroke-width="2.5" fill="none"/>
        <!-- 房子/商店 -->
        <path d="M14 22 L24 10 L34 22" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="26" y="18" width="4" height="4" stroke="white" stroke-width="2" fill="none"/>
        <rect x="18" y="18" width="4" height="4" rx="1" stroke="white" stroke-width="2" fill="none"/>
        <!-- 门 -->
        <rect x="20" y="28" width="8" height="10" rx="2" stroke="white" stroke-width="2.5"/>
        <circle cx="26" cy="33" r="1" fill="white"/>
        <!-- 货架元素 -->
        <line x1="14" y1="22" x2="34" y2="22" stroke="white" stroke-width="2"/>
      </svg>
    </div>

    <div class="app-name">智享商家端</div>
    <div class="app-subtitle">门店数字化经营助手</div>

    <div class="loader">
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
      <div class="loader-dot"></div>
    </div>
  </div>

  <div class="version" id="version">v1.0.0</div>

  <script src="native-bridge.js"></script>
  <script>
    (function () {
      // 显示版本号
      var version = '1.0.0';
      try {
        var v = window.__NATIVE__ && window.__NATIVE__.runtime.getVersion();
        if (v && v.name) version = 'v' + v.name;
      } catch (e) {}
      document.getElementById('version').textContent = version;

      // 2.5 秒后跳转到主应用
      var delay = 2500;
      try {
        var NATIVE = window.__NATIVE__;
        if (NATIVE && NATIVE.config) {
          NATIVE.config.load().then(function (cfg) {
            if (cfg && cfg.pages && cfg.pages.splashDuration) {
              delay = cfg.pages.splashDuration;
            }
          });
        }
      } catch (e) {}

      // 加载主应用
      function goToMain() {
        document.getElementById('splash').classList.add('splash-out');
        setTimeout(function () {
          window.location.replace('index.html');
        }, 380);
      }

      // 原生环境下等待 plusready
      if (window.plus) {
        document.addEventListener('plusready', function () {
          // 初始化原生桥接
          if (window.__NATIVE__) {
            window.__NATIVE__.init().then(function () {
              setTimeout(goToMain, delay);
            });
          } else {
            setTimeout(goToMain, delay);
          }
        }, false);
      } else {
        // 浏览器环境直接跳转
        setTimeout(goToMain, delay);
      }
    })();
  </script>
</body>
</html>
