appId: com.zhixiang.printagent
productName: 智享打印助手
copyright: Copyright © 2026 智享全链
directories:
  output: release
files:
  - dist/**/*
  - package.json
asar: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, ia32, arm64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 智享打印助手
  artifactName: "${productName}-${version}-${arch}-setup.${ext}"
