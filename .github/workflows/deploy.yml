name: Auto Deploy to Server

on:
  # S3-44：纯文档提交不应触发完整生产部署（含前端重建/pm2 重启），故加路径过滤。
  #   ⚠️ 只排文档/工作流配置，**不排 `deploy/**`**：部署脚本改动必须仍然必部署。
  #   ⚠️ 判据是"提交里**只要有一个**文件不在忽略名单内就触发" → 混合提交（文档+代码）照样部署。
  # S3-62（派单 C-2，林夕）：增 e2e/** —— 只改 e2e 测试不该触发完整生产部署（PR #21 即此种空转）。
  #   ⚠️ 安全性：判据是「只要有一个文件不在名单内就触发」 ⇒ 排 e2e 不会漏掉任何代码改动。
  #   ⚠️ 退路：workflow_dispatch 手动入口仍在（S3-44 已补），「改完测试想顺带部署」有路可走。
  #   ⚠️ 复看条件：若日后 e2e/ 下放了影响生产运行时的东西，本条须重评。
  push:
    branches: [main, fix/c2-deploy-concurrency]  # ⚠️ 临时：C-2 反测窗口，验证后还原为 [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/**"
      - "e2e/**"
  # S3-44：paths-ignore 会堵死"只想把已推的文档/配置再部署一次"这条路，
  #   因此**必须**保留手动入口（否则只能上服务器手跑 auto-deploy.sh，反而增加人为操作）。
  #   ⚠️ 本文件自身位于 `.github/**` → 改本文件不会自动部署，这符合预期。
  workflow_dispatch:
    inputs:
      reason:
        description: 手动触发原因（便于事后追溯为什么跑了一次部署）
        required: false
        type: string
        default: 手动触发

# ─── S3-62（派单 C-2，林夕）：生产部署并发保护 ───
# 背景：往 main 连推两笔（或连合两个 PR）会跑出两个并发生产部署：
#   git fetch + reset --hard、前端重建（同一 dist 被两进程写）、pm2 restart、nginx reload
#   在服务器上互相打架 ⇒ 最坏是生产停在「既不是旧版也不是新版」的半状态，
#   而两份部署日志各自显示成功（S3-62 立项卡 §1）。
# 🔴 cancel-in-progress 必须 false：true 会在中途取消，留下「拉了一半」的半状态，那比串行更糟。
#   false 的语义是排队 —— 第二次部署等第一次跑完再开始。
# ⚠️ group 名不要改：它是排队身份，改名等于另起一组，保护失效。
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 托管 runner：自托管 Windows runner 因本机网络访问 codeload 下载 actions 404 暂时不可用
    runs-on: ubuntu-latest
    steps:
      # ⚠️ 临时：C-2 反测窗口的占位步骤。非 main 分支只占位，不连服务器、不部署任何东西。
      - name: "[临时·反测] 占位 60s（不部署，仅用于观察并发排队）"
        if: github.ref != 'refs/heads/main'
        run: |
          echo "非 main 分支：只占位，不触发任何生产部署"
          sleep 120
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: github.ref == 'refs/heads/main'
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          script: |
            cd /opt/zhixiang/liquor-inventory-system
            bash deploy/auto-deploy.sh
