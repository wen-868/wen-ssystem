name: Auto Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    # 自托管 Windows runner（ZXQL-Desktop-ARM64），避免 GitHub 托管 runner 分配故障
    runs-on: self-hosted
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || '22' }}
          script: |
            cd /opt/zhixiang/liquor-inventory-system
            bash deploy/auto-deploy.sh
