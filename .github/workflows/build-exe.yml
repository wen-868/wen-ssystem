name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "admin-web/**"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: admin-web
        run: npm install --legacy-peer-deps
      - name: Build Vite
        working-directory: admin-web
        run: npx vite build
        env:
          # Electron 打包专用：相对资源路径 + hash 路由（file:// 下可正常加载）
          ELECTRON_BUILD: "1"
          VITE_AI_BASE_URL: https://admin.onepan.cn/ai-api
      - name: Build Electron EXE
        working-directory: admin-web
        env:
          # 代码签名证书（pfx 的 base64 或下载 URL）与私钥密码，在仓库 Secrets 中配置：
          #   CSC_LINK / CSC_KEY_PASSWORD
          # 未配置时 electron-builder 自动跳过签名，产物为未签名版（Windows 会提示未知发布者）
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          # electron-builder 与 type:module 不兼容，临时移除
          node -e "const p=require('./package.json');delete p.type;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npx electron-builder --win --publish=never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 智享全链管理系统-Windows
          path: admin-web/release/*.exe
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: admin-web/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
