name: Build Windows EXE

on:
  push:
    branches: [main]
    paths:
      - "admin-web/**"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        working-directory: admin-web
        run: npm install --legacy-peer-deps
      - name: Build Vite
        working-directory: admin-web
        run: npx vite build
        env:
          VITE_AI_BASE_URL: https://admin.onepan.cn/ai-api
      - name: Build Electron EXE
        working-directory: admin-web
        run: |
          # electron-builder 与 type:module 不兼容，临时移除
          node -e "const p=require('./package.json');delete p.type;require('fs').writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npx electron-builder --win --publish=never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 智享全链管理系统-Windows
          path: admin-web/release/*.exe
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: admin-web/release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
