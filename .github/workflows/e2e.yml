name: E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # ─────────────────────────────────────────────────────────────
    # 2026-09-18 凌舟裁定：取消 e2e 的 matrix 拆分，改回单一 job。
    #   背景：分支保护 required 配的是矩阵子 job 名 `e2e (admin-web)` / `e2e (saas-admin)`，
    #   而 main 的 job 名是父名 `e2e` —— 名字随分支漂移，永远有一套对不上，
    #   于是 #16 被矩阵腿挡住、#15/#18 上报父名永远等不到 required → 双向死锁。
    #   裁定：required 名只能等于 main 当前 job 名（`e2e`）；省那几分钟并行不值得。
    #   → admin-web 与 saas-admin 改为在同一个 job 内**顺序**执行（先 axe，后对比度矩阵）。
    #   → a11y 单独抽成观察期 job（见下方 `a11y`），非 required，不阻断。
    #
    #   ⚠️ 本 job 内的检查命令与阈值一律保持原样，不得为转绿放宽或跳过
    #      （这是铁律：不得降级检查）。
    #
    # S3-53：双端 a11y 门禁，两端都在本 job 内跑到。
    #   - admin-web：既有 Playwright + axe 浏览器扫描（登录页 + 工作台），断言不变（criticalSerious.length).toBe(0)。
    #   - saas-admin：dev server 在 5174（见 saas-admin/vite.config.ts），但登录页带**一次性图形验证码**
    #     （GET /platform/auth/captcha），自动化无法绕过 → 浏览器 axe 暂不能自动进场。
    #     → 按 S3-53 裁定采用降级方案：saas-admin 这一路只跑「对比度矩阵门禁」
    #       （scripts/contrast-check.cjs，纯计算、不依赖浏览器，覆盖 token×surface + canvas 图表色），
    #       浏览器 axe 扫描作为「待登录验证码进场脚本就绪」项保留（见 e2e/a11y.saas-admin.spec.ts，默认 skip），
    #       当前由对比度矩阵兜底。详见 docs/tasks/cards/R101-S3-53-林夕门禁回传.md。
    # ─────────────────────────────────────────────────────────────
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build backend
        run: npm --workspace backend run build

      - name: Start mock backend
        run: |
          USE_MOCK_DB=true NODE_ENV=development JWT_SECRET=e2e-secret PORT=8080 npm --workspace backend run start > /tmp/backend.log 2>&1 &
          npx wait-on -t 90000 http://127.0.0.1:8080/health

      - name: Start admin-web dev server
        run: |
          VITE_API_BASE=/api VITE_API_PROXY_TARGET=http://127.0.0.1:8080 npm --workspace admin-web run dev > /tmp/admin-web.log 2>&1 &
          npx wait-on -t 90000 http://127.0.0.1:5173

      - name: Start saas-admin dev server
        run: |
          npm --workspace saas-admin run dev > /tmp/saas-admin.log 2>&1 &
          npx wait-on -t 90000 http://127.0.0.1:5174

      - name: 密闭性取证（S3-59.1）：/api 必须打到 mock，不得回落生产
        # ─────────────────────────────────────────────────────────────
        # 派单 A-1 验收①：CI 内给出「确实打到 mock」的正向证据。
        #   证据一：dev server 的 /api 代理指向 127.0.0.1:8080，故经代理的
        #     /api/platform/health 必须带上 mock 专属标记 "mode":"mock-db"
        #     （生产响应永不吐该字段，见 backend/src/server.ts 的 mockSealMarker）。
        #     ⚠️ 不能用派单原文的 `/api/health` —— 后端没有这个路径（只有 /health 与
        #     /api/platform/health），会 404；也不能只断言 status:healthy，生产同样返回。
        #   证据二：经代理发一次登录探针，mock 后端日志须留下
        #     [mock-request] POST /api/admin/auth/login（该日志仅 USE_MOCK_DB 下挂载）。
        # 🔴 本步**没有** continue-on-error —— 密闭性被破坏必须红。
        # ─────────────────────────────────────────────────────────────
        run: |
          echo "===== 证据一：/api 响应须带 mock 专属标记 ====="
          DIRECT=$(curl -s http://127.0.0.1:8080/api/platform/health)
          PROXIED=$(curl -s http://127.0.0.1:5173/api/platform/health)
          echo "direct  : $DIRECT"
          echo "proxied : $PROXIED"
          echo "$DIRECT" | grep -q '"mode":"mock-db"' || { echo "❌ 直连 mock 未带 mock 标记"; exit 1; }
          echo "$PROXIED" | grep -q '"mode":"mock-db"' || { echo "❌ 经 dev server 代理未带 mock 标记 —— /api 未打到 mock"; exit 1; }
          echo "===== 证据二：登录请求落到 mock 后端日志 ====="
          curl -s -o /dev/null -X POST http://127.0.0.1:5173/api/admin/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci-seal-probe","password":"ci-seal-probe"}'
          sleep 2
          grep -n "\[mock-request\] POST /api/admin/auth/login" /tmp/backend.log || { echo "❌ mock 后端日志未见登录请求"; exit 1; }
          echo "mock-request 日志总数: $(grep -c '\[mock-request\]' /tmp/backend.log)"
          echo "✅ 密闭性取证通过：/api 打到本地 mock 后端，未回落生产"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E tests (admin-web, Playwright + axe) —— 排除 @a11y 漂移用例
        # 🔴 S3-61 分层（凌舟 2026-09-19 裁定「甲」）：本 job 是 **required**，
        #    而 e2e/a11y.spec.ts 的两个用例正在漂移（工作台 56 个 color-contrast 节点，
        #    根因＝App.vue 的 page-fade 淡入中间帧被 axe 采样，见 S3-61 卡 §4.1–4.3）。
        #    铁律：**漂移中的检查不得进 required** —— 否则每个 PR 被随机堵。
        #    实证：PR #19 只改 saas-admin 3 个 token，却被本 job 挡住（e2e failure）。
        #    ⇒ `--grep-invert @a11y` 把漂移用例交给观察期 a11y job。
        #    🔴 断言仍然只有一份、阈值一行未动 —— 分层是**放对位置**，不是让红变绿。
        #       稳定化落地 + 连续 10 次无漂移后再并回 required。
        run: npx playwright test --grep-invert @a11y

      - name: saas-admin a11y gate (contrast matrix)
        # 纯计算、不依赖浏览器：读取 tokens.css / theme.ts 真实取值，构建 token×surface 矩阵，
        # 任一 token 不达标即 exit 1。这是 saas-admin 当前的 a11y 门禁（浏览器 axe 待进场脚本就绪）。
        run: node scripts/contrast-check.cjs

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e-report/
          retention-days: 30

  # ─────────────────────────────────────────────────────────────
  # a11y 观察期 job（2026-09-18 凌舟裁定）
  #   • **非 required，永不阻断合并**（job 级 continue-on-error: true）
  #   • 目的：观察漂移。今天是 3/8 间歇（见 S3-60：.feed-card--trend > .el-card__body
  #     触发 scrollable-region-focusable），把漂移的东西设成 required 就是「每个 PR 随机被堵」。
  #   • 约定：**连续 10 次无漂移后再并进 e2e**。达标前不得改 e2e 的 required 集合。
  #   • 每次取样都要求输出 nodes target（带元素身份）——否则无法核对，等于不可定位
  #     （这是 S3-59 缺陷三，也是当初 S3-47 归因被撤回的原因）。
  #
  # 🔴 2026-09-19 修正（凌舟裁定）：本 job **去掉 job 级 `continue-on-error`**。
  #    原因：job 级 continue-on-error 会把失败**洗成绿** —— PR #19 里本 job 显示 pass，
  #    但它的命令实际是失败的。这正是我们一直在收拾的「绿灯信息 ≠ 真实状态」。
  #    正确做法：**红就是红**，靠「非 required」保证不阻断，而不是把失败洗成绿。
  #    否则「观察 10 次无漂移」这个判据**本身就是假的**。
  #    ⇒ 保留**采样步骤级** continue-on-error（保证 3 次取样都跑完）；
  #      末尾新增汇总步骤（**无** continue-on-error）如实判定：任一取样非零 → exit 1。
  # ─────────────────────────────────────────────────────────────
  a11y:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build backend
        run: npm --workspace backend run build

      - name: Start mock backend
        run: |
          USE_MOCK_DB=true NODE_ENV=development JWT_SECRET=e2e-secret PORT=8080 npm --workspace backend run start > /tmp/backend.log 2>&1 &
          npx wait-on -t 90000 http://127.0.0.1:8080/health

      - name: Start admin-web dev server
        run: |
          VITE_API_BASE=/api VITE_API_PROXY_TARGET=http://127.0.0.1:8080 npm --workspace admin-web run dev > /tmp/admin-web.log 2>&1 &
          npx wait-on -t 90000 http://127.0.0.1:5173

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: a11y sampling x3 (observation only, never blocks)
        # 三次取样，每次独立跑完并打印命中明细（含 nodes target）。
        # continue-on-error 保证三次都跑完，不会因为第一次失败就跳过后面两次 ——
        # 观察漂移要看的是「每次结果分别是多少」，不是「有没有失败过一次」。
        #
        # `--grep @a11y`：只跑被 required e2e 排除出去的那两个漂移用例（分层，S3-61）。
        # `--retries=0`：**必须**。观察期的目的是**计量漂移**，带重试会把漂移洗掉
        #   （PR #19 那次 retry #1 也红所以看不出来，下次就不一定了）。
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            echo "===== a11y sample $i / 3 ====="
            set +e
            npx playwright test --grep @a11y --retries=0 --reporter=list 2>&1 | tee "/tmp/a11y-sample-$i.txt"
            code=${PIPESTATUS[0]}
            set -e
            echo "[sample $i] playwright exit=$code (PIPESTATUS[0]，排除 tee 干扰)"
            echo "$code" > "/tmp/a11y-exit-$i.txt"
          done
          echo "===== 三次取样汇总 ====="
          for i in 1 2 3; do
            echo "--- sample $i ---"
            grep -E "\[a11y\]" "/tmp/a11y-sample-$i.txt" || echo "  (无 [a11y] 输出)"
          done

      - name: a11y sampling verdict (如实判定，红就是红)
        # 🔴 本步骤**没有** continue-on-error —— 红就是红。
        #    不阻断靠的是「本 job 非 required」，不是把失败洗成绿。
        #    洗绿会让「连续 10 次无漂移」这个判据本身变成假的。
        run: |
          fail=0
          for i in 1 2 3; do
            code=$(cat "/tmp/a11y-exit-$i.txt" 2>/dev/null || echo MISSING)
            echo "[sample $i] exit=$code"
            if [ "$code" != "0" ]; then fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            echo "❌ a11y 观察期：至少一次取样非零 —— 真实信号（本 job 非 required，不阻断合并）"
            exit 1
          fi
          echo "✅ a11y 观察期：三次取样均为 0"

      - name: Upload a11y observation samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-observation-samples
          path: /tmp/a11y-sample-*.txt
          retention-days: 30
