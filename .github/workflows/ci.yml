name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # 托管 runner：自托管 Windows runner（ZXQL-Desktop-ARM64）曾因本机网络访问 codeload 下载
    # actions 持续 404 而失败，先切回托管；本机网络修复后再切回 self-hosted
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Backend unit tests
        run: npm --workspace backend test

      - name: Backend lint gate (zero error)
        run: npm --workspace backend run lint

      - name: Shell script syntax check (deploy/scripts)
        run: bash -n deploy/*.sh scripts/*.sh

      - name: Backend coverage gate (baseline 2026-08-15)
        run: npm --workspace backend run test -- --coverage

      - name: Dependency audit (non-blocking, baseline recorded)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Duplication check (non-blocking, baseline recorded)
        continue-on-error: true
        run: npm run dup:check

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 30

      - name: Build backend
        run: npm --workspace backend run build

      - name: Build admin web
        run: npm --workspace admin-web run build

      - name: Build saas admin
        run: npm --workspace saas-admin run build

      - name: Start mock backend
        # 使用已构建的 dist 启动（node dist/server.js），避免 tsx watch 在 CI 后台不稳定
        # env.ts 已支持 mock+dev 兜底 JWT_SECRET（061f9205），此处显式注入 CI 测试密钥
        run: USE_MOCK_DB=true NODE_ENV=development JWT_SECRET=ci-test-secret npm --workspace backend run start > /tmp/zhixiang-backend.log 2>&1 &

      - name: Wait for backend
        run: npx wait-on -t 90000 http://127.0.0.1:8080/health || (echo "=== backend log ==="; cat /tmp/zhixiang-backend.log; exit 1)

      - name: Flow self test
        run: npm run test:flow

      - name: QA regression test
        run: npm run test:qa

  migration-check:
    # 数据库迁移纳入 CI：真实 MySQL 8 执行迁移脚本，验证关键表存在（验收项：迁移可前滚/纳入 CI）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: liquor_inventory
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build backend
        run: npm --workspace backend run build

      - name: Run migrations via server boot and verify tables
        run: |
          DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root DB_PASSWORD=root \
          DB_NAME=liquor_inventory NODE_ENV=production JWT_SECRET=ci-migration-secret \
          PORT=8095 node backend/dist/server.js > /tmp/mig.log 2>&1 &
          npx wait-on -t 120000 http://127.0.0.1:8095/health || (echo "=== 迁移日志 ==="; cat /tmp/mig.log; exit 1)
          mysql -h127.0.0.1 -uroot -proot liquor_inventory -e "
            SHOW TABLES LIKE 't_sale_bill';
            SHOW TABLES LIKE 't_sys_user';
            SHOW TABLES LIKE 't_seckill_order';
            SHOW TABLES LIKE 't_user_coupon';
            SHOW TABLES LIKE 't_payment_config';
            SHOW TABLES LIKE 't_print_template';
          "
          if grep -q "失败" /tmp/mig.log; then echo "存在迁移失败记录"; cat /tmp/mig.log; exit 1; fi
          echo "迁移验证通过"
