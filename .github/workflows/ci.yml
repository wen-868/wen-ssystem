name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend unit tests
        id: backend-tests
        run: USE_MOCK_DB=true npm --workspace backend test 2>&1 | tee /tmp/backend-test.log || true

      - name: Build backend
        run: npm --workspace backend run build

      - name: Build admin web
        run: npm --workspace admin-web run build

      - name: Build store terminal
        run: npm --workspace store-terminal run build

      - name: Start mock backend
        run: USE_MOCK_DB=true npm --workspace backend run dev > /tmp/zhixiang-backend.log 2>&1 &

      - name: Wait for backend
        run: npx wait-on http://127.0.0.1:8080/health

      - name: Flow self test
        run: npm run test:flow

      - name: Store quick test
        run: npm run test:store

      - name: QA regression test
        run: npm run test:qa

      - name: UI contract test
        run: npm run test:ui

      - name: 📤 飞书工作汇报
        if: always()
        run: |
          if [ -n "$FEISHU_WEBHOOK_URL" ]; then
            STATUS="DONE"
            if [ "${{ job.status }}" != "success" ]; then STATUS="BLOCKED"; fi
            node scripts/send-report.mjs \
              --phase "CI 自动构建 · ${GITHUB_REF_NAME:-main}" \
              --status "$STATUS" \
              --summary "Job Status: ${{ job.status }} · Commit: ${GITHUB_SHA::8}" \
              -d "Commit" "${GITHUB_SHA::8}" \
              -d "分支" "${GITHUB_REF_NAME:-main}" \
              -d "Job状态" "${{ job.status }}" \
              -d "触发者" "${{ github.actor }}" \
              --reporter "苏然"
          else
            echo "⚠ FEISHU_WEBHOOK_URL 未配置，跳过飞书汇报。请在 GitHub Secrets 添加 FEISHU_WEBHOOK_URL 即可开启自动汇报。"
            node scripts/phase-tracker.mjs --no-send done "CI 自动构建 · ${GITHUB_REF_NAME:-main}" "Job Status: ${{ job.status }} · Commit: ${GITHUB_SHA::8}"
          fi
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
