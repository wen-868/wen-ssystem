name: CI

on:
  push:
    branches: [main, test/d1-concurrency-proof]  # ⚠️ 临时：D-1 反测窗口，验证后还原为 [main]
  pull_request:

jobs:
  build-and-test:
    # 托管 runner：自托管 Windows runner（ZXQL-Desktop-ARM64）曾因本机网络访问 codeload 下载
    # actions 持续 404 而失败，先切回托管；本机网络修复后再切回 self-hosted
    runs-on: ubuntu-latest
    steps:
      - name: "[D-1临时] 并发观察占位 90s（不部署、不改生产）"
        if: github.ref != 'refs/heads/main'
        run: |
          echo "[D-1] workflow=${GITHUB_WORKFLOW} ref=${GITHUB_REF} run_id=${GITHUB_RUN_ID}"
          echo "[D-1] placeholder_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          sleep 90
          echo "[D-1] placeholder_end=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # S3-46：本步骤**前置于所有代码门禁**，并加 `if: always()`（双重保险）。
      #   原位置在 `Backend lint gate` 之后 → lint 一红（曾因 `login-fail-limiter.test.ts:58`
      #   的 `\-` 多余转义）本步骤就被 **skipped**，部署脚本语法**实际没检成**
      #   —— 与踩坑 [78]「前置失败永久掩蔽后置缺陷」同一形状。
      #   → 前置：不再被任何代码门禁掩蔽（它是全 CI 最便宜的检查，理应最先跑）。
      #   → always()：即便 `npm ci` 等前置步骤失败，也仍把脚本语法结论打出来。
      - name: Shell script syntax check (deploy/scripts)
        if: always()
        # S3-49：⚠️ `bash -n` / `node --check` 这类命令**只处理第一个参数**，
        #   其余会被当作脚本的**位置参数** → 旧写法 `bash -n deploy/*.sh scripts/*.sh`
        #   **实际只检了字母序第一个** `02-mysql-backup.sh`，12 个部署脚本里 **11 个从未被检**
        #   （含我们反复加固的 `auto-deploy.sh`、`ai-base-deploy.sh`）；
        #   而 `scripts/*.sh` 当前无匹配，字面量被当参数传进去、静默无意义。
        #   → 必须**逐文件**循环。反测已证实：坏一个排在末尾的脚本，旧写法 exit 0（假绿灯）、新写法 exit 1。
        run: |
          set -uo pipefail
          checked=0
          fail=0
          for f in deploy/*.sh scripts/*.sh; do
            [ -e "$f" ] || continue          # 空 glob 兜底（scripts/ 下当前无 .sh）
            checked=$((checked + 1))
            if ! bash -n "$f"; then
              echo "::error file=${f}::shell 语法错误"
              fail=1
            fi
          done
          # 数量本身就是判据：若这里长期是 1，说明又退化成"只检第一个"了
          echo "已语法检查 ${checked} 个 shell 脚本"
          if [ "${checked}" -lt 1 ]; then
            echo "::error::未匹配到任何待检脚本（glob 可能写错或目录已空）"
            exit 1
          fi
          [ "${fail}" -eq 0 ] || exit 1

      # S3-53：对比度矩阵门禁（WCAG AA 4.5:1）。
      #   纯 node、不依赖 node_modules，故置于 npm ci 之前也能跑；并加 `if: always()`，
      #   沿用上方 Shell script syntax check 的教训——不被任何前置步骤（如 `npm ci`、
      #   backend 单测）的失败掩蔽，本步骤本身失败也会把结论打出来。
      #   ⚠️ 逐文件调用（见 Shell script syntax check 注释）：此处只有单个脚本，
      #   写全路径 `node scripts/contrast-check.cjs`，**不要**用 `node scripts/*.cjs` 通配，
      #   否则只处理字母序第一个、其余被当参数静默吞掉（假绿灯）。
      #   脚本读取 saas-admin/src/styles/tokens.css 与 admin-web/src/styles/theme.ts 的
      #   **真实取值**构建 token×surface 矩阵；任一 token 改回不达标值 → 本步骤必红（exit 1）。
      - name: Contrast / a11y token gate (WCAG AA)
        if: always()
        run: node scripts/contrast-check.cjs

      - name: Backend unit tests
        run: npm --workspace backend test

      - name: Backend lint gate (zero error)
        run: npm --workspace backend run lint

      - name: Backend coverage gate (baseline 2026-08-15)
        run: npm --workspace backend run test -- --coverage

      - name: Dependency audit (non-blocking, baseline recorded)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

      - name: Duplication check (non-blocking, baseline recorded)
        continue-on-error: true
        run: npm run dup:check

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 30

      - name: Build backend
        run: npm --workspace backend run build

      - name: Build admin web
        run: npm --workspace admin-web run build

      - name: Build saas admin
        run: npm --workspace saas-admin run build

      - name: Start mock backend
        # 使用已构建的 dist 启动（node dist/server.js），避免 tsx watch 在 CI 后台不稳定
        # env.ts 已支持 mock+dev 兜底 JWT_SECRET（061f9205），此处显式注入 CI 测试密钥
        run: USE_MOCK_DB=true NODE_ENV=development JWT_SECRET=ci-test-secret npm --workspace backend run start > /tmp/zhixiang-backend.log 2>&1 &

      - name: Wait for backend
        run: npx wait-on -t 90000 http://127.0.0.1:8080/health || (echo "=== backend log ==="; cat /tmp/zhixiang-backend.log; exit 1)

      - name: Flow self test
        run: npm run test:flow

      - name: QA regression test
        run: npm run test:qa

      - name: Security smoke scan (basic DAST)
        run: node scripts/security-smoke.mjs

  # ---------------------------------------------------------------------------
  # 原 `ai-base` job 已随 `backend/ai-base` 目录一并移除（2026-09-16，S3-36）。
  #
  # 移除原因：该 job 的门禁对象是 `backend/ai-base` —— 一个**无 .git、不参与部署
  # 的旧分叉副本**（生产 ai-base 部署自 wen-868/ZXQL-AI，检出 /opt/zhixiang/ai-base）。
  # 也就是说它一直是个**假门禁**：这里绿了并不代表生产代码没问题，生产代码从未被
  # 任何 CI 覆盖。留着只会制造"AI 底座有门禁"的错觉，故随副本一并删除。
  #
  # ⚠️ 由此产生真实缺口：**AI 底座目前零 CI 门禁**（构建 / lint / 单测均无）。
  # 正确做法是在权威仓库 `wen-868/ZXQL-AI` 内建自己的 CI（本仓跨仓 checkout 需 PAT，
  # 默认 GITHUB_TOKEN 只能访问本仓）。此项已登记，待凌舟配置仓库密钥后实施。
  # ---------------------------------------------------------------------------

  migration-check:
    # 数据库迁移纳入 CI：真实 MySQL 8 执行迁移脚本，验证关键表存在（验收项：迁移可前滚/纳入 CI）
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: liquor_inventory
        ports:
          - 3306:3306
        # S3-48：⚠️ `options:` 只接受 **docker create 的参数**，不是 mysqld 参数。
        #   原写法把 `--character-set-server` / `--collation-server` 塞在这里 →
        #   `unknown flag`，exit code 125 → **本 job 从没真正跑过**（假门禁）。
        #   现直接去掉：mysql:8.0 默认即 utf8mb4 / utf8mb4_0900_ai_ci，
        #   且 `docs/migrations/001_phase1_schema.sql` 等本就显式声明 utf8mb4_0900_ai_ci
        #   （170 个迁移里 117 个已显式声明，其余继承默认同值）→ 去掉反而**更贴近生产实际**。
        options: >-
            --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
            --health-interval=5s
            --health-timeout=5s
            --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build backend
        run: npm --workspace backend run build

      - name: Run migrations via server boot and verify tables
        run: |
          DB_HOST=127.0.0.1 DB_PORT=3306 DB_USER=root DB_PASSWORD=root \
          DB_NAME=liquor_inventory NODE_ENV=production JWT_SECRET=ci-migration-secret \
          PORT=8095 node backend/dist/server.js > /tmp/mig.log 2>&1 &
          npx wait-on -t 120000 http://127.0.0.1:8095/health || (echo "=== 迁移日志 ==="; cat /tmp/mig.log; exit 1)
          mysql -h127.0.0.1 -uroot -proot liquor_inventory -e "
            SHOW TABLES LIKE 't_sale_bill';
            SHOW TABLES LIKE 't_sys_user';
            SHOW TABLES LIKE 't_seckill_order';
            SHOW TABLES LIKE 't_user_coupon';
            SHOW TABLES LIKE 't_payment_config';
            SHOW TABLES LIKE 't_print_template';
          "
          if grep -q "失败" /tmp/mig.log; then echo "存在迁移失败记录"; cat /tmp/mig.log; exit 1; fi
          echo "迁移验证通过"
