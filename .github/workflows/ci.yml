name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend unit tests
        run: npm --workspace backend test

      - name: Build backend
        run: npm --workspace backend run build

      - name: Build admin web
        run: npm --workspace admin-web run build

      - name: Build store terminal
        run: npm --workspace store-terminal run build

      - name: Start mock backend
        run: USE_MOCK_DB=true npm --workspace backend run dev > /tmp/zhixiang-backend.log 2>&1 &

      - name: Wait for backend
        run: npx wait-on http://127.0.0.1:8080/health

      - name: Flow self test
        run: npm run test:flow
