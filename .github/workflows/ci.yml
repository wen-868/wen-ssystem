name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Backend unit tests
        run: npm --workspace backend test

      - name: Build backend
        run: npm --workspace backend run build

      - name: Build admin web
        run: npm --workspace admin-web run build

      - name: Build saas admin
        run: npm --workspace saas-admin run build

      - name: Start mock backend
        # 使用已构建的 dist 启动（node dist/server.js），避免 tsx watch 在 CI 后台不稳定
        run: USE_MOCK_DB=true NODE_ENV=development npm --workspace backend run start > /tmp/zhixiang-backend.log 2>&1 &

      - name: Wait for backend
        run: npx wait-on -t 90000 http://127.0.0.1:8080/health || (echo "=== backend log ==="; cat /tmp/zhixiang-backend.log; exit 1)

      - name: Flow self test
        run: npm run test:flow

      - name: QA regression test
        run: npm run test:qa
