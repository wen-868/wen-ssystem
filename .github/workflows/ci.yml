name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # 自托管 Windows runner（ZXQL-Desktop-ARM64），避免 GitHub 托管 runner 分配故障
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Backend unit tests
        run: npm --workspace backend test

      - name: Build backend
        run: npm --workspace backend run build

      - name: Build admin web
        run: npm --workspace admin-web run build

      - name: Build saas admin
        run: npm --workspace saas-admin run build

      - name: Start mock backend
        # 使用已构建的 dist 启动（node dist/server.js），避免 tsx watch 在 CI 后台不稳定
        # Windows runner：用 pwsh 设置环境变量 + Start-Process 后台启动，日志写入 RUNNER_TEMP
        shell: pwsh
        run: |
          $env:USE_MOCK_DB = 'true'
          $env:NODE_ENV = 'development'
          $env:JWT_SECRET = 'ci-test-secret'
          $logDir = Join-Path $env:RUNNER_TEMP 'backend'
          New-Item -ItemType Directory -Path $logDir -Force | Out-Null
          Start-Process -FilePath 'npm.cmd' -ArgumentList @('--workspace','backend','run','start') `
            -RedirectStandardOutput (Join-Path $logDir 'out.log') `
            -RedirectStandardError (Join-Path $logDir 'err.log') -WindowStyle Hidden

      - name: Wait for backend
        shell: pwsh
        run: |
          npx wait-on -t 90000 http://127.0.0.1:8080/health
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== backend out.log ==="
            Get-Content (Join-Path $env:RUNNER_TEMP 'backend/out.log') -ErrorAction SilentlyContinue
            Write-Host "=== backend err.log ==="
            Get-Content (Join-Path $env:RUNNER_TEMP 'backend/err.log') -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Flow self test
        run: npm run test:flow

      - name: QA regression test
        run: npm run test:qa
