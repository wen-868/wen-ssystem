      2. POST /api/admin/purchase-payments/:paymentNo/approve - 审核
      3. 支持按订单付款、预付款、退货退款
      4. 付款审核通过后更新订单已付金额
      付款单号：CGFK + 年月日 + 4位序号
      数据库表：purchase_payment
    assignee: agent-ajian
    priority: P0
    status: todo
    estimated_hours: 10
