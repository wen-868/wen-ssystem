tasks:

  # ==================== 阿坚（后端）任务 ====================

  - id: A101
    title: 供应商管理 API
    description: |
      实现供应商管理完整 CRUD：
      1. GET/POST /api/admin/suppliers - 列表/新增
      2. GET/PUT /api/admin/suppliers/:id - 详情/修改
      3. POST /api/admin/suppliers/:id/contacts - 添加联系人
      4. 供应商编码自动生成规则：GYS + 年月日 + 3位序号
      数据库表：supplier, supplier_contact
    assignee: agent-ajian
    priority: P0
    status: todo
    estimated_hours: 12
    dependencies: []
    deliverables:
      - 供应商 CRUD 接口
      - 编码生成逻辑
      - 联系人管理接口

  - id: A102
    title: 采购订单 API
    description: |
      实现采购订单全流程：
      1. GET/POST /api/admin/purchase-orders - 列表/创建
      2. GET /api/admin/purchase-orders/:orderNo - 详情
      3. POST /api/admin/purchase-orders/:orderNo/approve - 审核
      4. POST /api/admin/purchase-orders/:orderNo/cancel - 取消
      5. 订单号生成：CGDD + 年月日 + 4位序号
      6. 创建时自动计算：商品金额、税额、应付金额
      7. 审核后状态流转：DRAFT -> PENDING -> APPROVED
      数据库表：purchase_order, purchase_order_item
    assignee: agent-ajian
    priority: P0
    status: todo
    estimated_hours: 16
    dependencies:
      - A101
    deliverables:
      - 采购订单 CRUD
      - 审核/取消流程
      - 金额自动计算

  - id: A103
    title: 采购入库 API
    description: |
      实现采购入库全流程：
      1. GET/POST /api/admin/purchase-in-stocks - 列表/创建
      2. GET /api/admin/purchase-in-stocks/:stockNo - 详情
      3. POST /api/admin/purchase-in-stocks/:stockNo/approve - 审核（增加库存）
      4. POST /api/admin/purchase-in-stocks/:stockNo/void - 作废（回滚库存）
      5. 支持按采购订单入库（自动带出订单明细）
      6. 支持无订单直接入库
      7. 入库审核通过后：
         - 增加 inventory_balance 库存
         - 写 inventory_ledger 台账
         - 更新采购订单已入库数量
      入库单号：CGRK + 年月日 + 4位序号
      数据库表：purchase_in_stock, purchase_in_stock_item
    assignee: agent-ajian
    priority: P0
    status: todo
    estimated_hours: 16
    dependencies:
      - A102
    deliverables:
      - 入库单 CRUD
      - 审核增加库存逻辑
      - 作废回滚逻辑
      - 关联采购订单更新

  - id: A104
    title: 采购退货 API
    description: |
      实现采购退货：
      1. GET/POST /api/admin/purchase-returns - 列表/创建
      2. GET /api/admin/purchase-returns/:returnNo - 详情
      3. POST /api/admin/purchase-returns/:returnNo/approve - 审核（扣减库存）
      4. 退货审核通过后扣减库存，写台账
      退货单号：CGTH + 年月日 + 4位序号
      数据库表：purchase_return, purchase_return_item
    assignee: agent-ajian
    priority: P0
    status: todo
    estimated_hours: 12
    dependencies:
      - A103
    deliverables:
      - 采购退货 CRUD
      - 审核扣减库存

