      4. POST /api/store/sale-returns/:returnNo/refund - 确认退款
      5. 支持按销售单退货（自动带出原单商品）
      6. 支持直接退货
      退货单号：XSTH + 年月日 + 4位序号
      数据库表：sale_return, sale_return_item
    assignee: agent-ajian
    priority: P0
    status: todo
    estimated_hours: 14
    dependencies: []
    deliverables:
