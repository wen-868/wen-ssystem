      1. GET/POST /api/store/customer-statements - 列表/生成
      2. GET /api/store/customer-statements/:statementNo - 详情
      3. POST /api/store/customer-statements/:statementNo/confirm - 确认
      4. 生成对账单时汇总指定期间：
         - 销售单金额（sale_bill）
         - 销售退货金额（sale_return）
         - 收款金额（customer_payment / sale_payment）
      5. 计算期初余额、期末余额
      对账单号：KHDZ + 年月日 + 4位序号
      数据库表：customer_statement
    assignee: agent-ajian
    priority: P0
    status: todo
    estimated_hours: 14
    dependencies:
      - A106
    deliverables:
