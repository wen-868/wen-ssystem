# ========== 数据库变更 ==========
database_changes:
  file: docs/phase2_schema.sql
  tables_added:
    - supplier
    - supplier_contact
    - purchase_order
    - purchase_order_item
    - purchase_in_stock
    - purchase_in_stock_item
    - purchase_return
    - purchase_return_item
    - purchase_payment
    - customer_statement
    - customer_payment
    - sale_return
    - sale_return_item
    - sale_payment
  tables_altered:
    - sale_bill: 新增 sale_type, due_date, statement_id

# ========== API 文档 ==========
api_documentation:
  phase1: docs/phase1_openapi.yaml
  phase2: docs/phase2_openapi.yaml

# ========== 编码规则 ==========
id_rules:
  supplier_code: "GYS{YYMMDD}{NNN}"
  purchase_order: "CGDD{YYMMDD}{NNNN}"
  purchase_in_stock: "CGRK{YYMMDD}{NNNN}"
  purchase_return: "CGTH{YYMMDD}{NNNN}"
  purchase_payment: "CGFK{YYMMDD}{NNNN}"
  sale_return: "XSTH{YYMMDD}{NNNN}"
  customer_statement: "KHDZ{YYMMDD}{NNNN}"
  customer_payment: "KHSK{YYMMDD}{NNNN}"
  sale_payment: "XSSK{YYMMDD}{NNNN}"
