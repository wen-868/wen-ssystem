# ============================================
# 智享酒水库存管理系统 - Nginx 生产配置
# 域名: onepan.cn
# ============================================

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name api.onepan.cn admin.onepan.cn m.onepan.cn store.onepan.cn www.onepan.cn onepan.cn;
    return 301 https://$host$request_uri;
}

# 后端 API
server {
    listen 443 ssl http2;
    server_name api.onepan.cn;

    ssl_certificate /etc/letsencrypt/live/api.onepan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.onepan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
    }
}

# 管理后台
server {
    listen 443 ssl http2;
    server_name admin.onepan.cn;

    ssl_certificate /etc/letsencrypt/live/admin.onepan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.onepan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/admin-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 商家端 H5
server {
    listen 443 ssl http2;
    server_name m.onepan.cn;

    ssl_certificate /etc/letsencrypt/live/m.onepan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/m.onepan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/merchant-mobile;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 门店终端 PWA
server {
    listen 443 ssl http2;
    server_name store.onepan.cn;

    ssl_certificate /etc/letsencrypt/live/store.onepan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/store.onepan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/store-terminal;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PWA Service Worker
    location /sw.js {
        add_header Cache-Control "no-cache";
    }

    location /manifest.json {
        add_header Cache-Control "no-cache";
    }
}

# 官网 www.onepan.cn + 裸域名 onepan.cn
server {
    listen 443 ssl http2;
    server_name www.onepan.cn onepan.cn;

    ssl_certificate /etc/letsencrypt/live/www.onepan.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.onepan.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
