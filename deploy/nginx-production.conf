# ============================================
# 智享酒水库存管理系统 - Nginx 生产配置
# 域名: onepan.cn
# 证书: 腾讯云SSL (路径: /etc/nginx/ssl/{域名}_nginx/)
# 每个域名文件夹内包含: {域名}_bundle.pem + {域名}.key
# ============================================

# HTTP -> HTTPS 重定向（所有域名）
server {
    listen 80;
    server_name api.onepan.cn admin.onepan.cn m.onepan.cn www.onepan.cn saas.onepan.cn onepan.cn;
    return 301 https://$host$request_uri;
}

# 后端 API
server {
    listen 443 ssl http2;
    server_name api.onepan.cn;

    ssl_certificate /etc/nginx/ssl/api.onepan.cn_nginx/api.onepan.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/api.onepan.cn_nginx/api.onepan.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://127.0.0.1:8080;
    }
}

# 管理后台
server {
    listen 443 ssl http2;
    server_name admin.onepan.cn;

    ssl_certificate /etc/nginx/ssl/admin.onepan.cn_nginx/admin.onepan.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/admin.onepan.cn_nginx/admin.onepan.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/admin-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 底座（SSE 流式对话）：/ai-api/* → 服务器 3016（保留 /api 前缀）
    location /ai-api/ {
        proxy_pass http://127.0.0.1:3016/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# 商家端 H5
server {
    listen 443 ssl http2;
    server_name m.onepan.cn;

    ssl_certificate /etc/nginx/ssl/m.onepan.cn_nginx/m.onepan.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/m.onepan.cn_nginx/m.onepan.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/app-mobile;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 官网 www.onepan.cn + 裸域名 onepan.cn
server {
    listen 443 ssl http2;
    server_name www.onepan.cn onepan.cn;

    ssl_certificate /etc/nginx/ssl/www.onepan.cn_nginx/www.onepan.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/www.onepan.cn_nginx/www.onepan.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# SaaS 平台总后台
server {
    listen 443 ssl http2;
    server_name saas.onepan.cn;

    ssl_certificate /etc/nginx/ssl/saas.onepan.cn_nginx/saas.onepan.cn_bundle.pem;
    ssl_certificate_key /etc/nginx/ssl/saas.onepan.cn_nginx/saas.onepan.cn.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/saas-admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
