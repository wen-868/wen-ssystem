# 智享全链管理系统 Nginx 配置模板
# 使用前请替换：YOUR_DOMAIN、/opt/zhixiang/liquor-inventory-system

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name api.YOUR_DOMAIN admin.YOUR_DOMAIN m.YOUR_DOMAIN;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# 后端 API
server {
  listen 443 ssl http2;
  server_name api.YOUR_DOMAIN;

  ssl_certificate /etc/letsencrypt/live/api.YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  client_max_body_size 20m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

# 工作台
server {
  listen 443 ssl http2;
  server_name admin.YOUR_DOMAIN;

  ssl_certificate /etc/letsencrypt/live/api.YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  root /opt/zhixiang/liquor-inventory-system/admin-web/dist;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # AI 底座（SSE 流式对话 + WebSocket 实时推送）：/ai-api/* → 服务器 3016（保留 /api 前缀）
  location /ai-api/ {
    proxy_pass http://127.0.0.1:3016/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}

# 商家端 H5
server {
  listen 443 ssl http2;
  server_name m.YOUR_DOMAIN;

  ssl_certificate /etc/letsencrypt/live/api.YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  root /opt/zhixiang/liquor-inventory-system/app-mobile/dist;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
