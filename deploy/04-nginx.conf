# 智享营销系统 Nginx 配置模板
# 使用前请替换：YOUR_DOMAIN、/opt/zhixiang/liquor-inventory-system

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name api.YOUR_DOMAIN admin.YOUR_DOMAIN store.YOUR_DOMAIN merchant.YOUR_DOMAIN;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name api.YOUR_DOMAIN;

  ssl_certificate /etc/letsencrypt/live/api.YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options DENY always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  client_max_body_size 20m;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}

server {
  listen 443 ssl http2;
  server_name admin.YOUR_DOMAIN;

  ssl_certificate /etc/letsencrypt/live/api.YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  root /opt/zhixiang/liquor-inventory-system/admin-web/dist;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl http2;
  server_name merchant.YOUR_DOMAIN;

  ssl_certificate /etc/letsencrypt/live/api.YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  root /opt/zhixiang/liquor-inventory-system/merchant-mobile/dist;
  index index.html;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 443 ssl http2;
  server_name store.YOUR_DOMAIN;

  ssl_certificate /etc/letsencrypt/live/api.YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header X-Content-Type-Options nosniff always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

  root /opt/zhixiang/liquor-inventory-system/store-terminal/dist;
  index index.html;

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /sw.js =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files /manifest.webmanifest =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
  }
}
